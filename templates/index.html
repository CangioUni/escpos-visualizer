<!DOCTYPE html>
<html>
<head>
    <title>ESC/POS Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --zoom: 1.5; /* Default zoom for better visibility */
            --font-scale: 1.0; /* Font scaling independently */
            --paper-width: 80mm;
            /* To fit exactly 48 characters, we calculate font width based on 80mm width minus 10mm total padding */
            --char-width: calc((var(--paper-width) - 10mm) / 48);
        }

        body { 
            background: #2c2c2c; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: row;
            padding: 0;
            margin: 0;
            color: #ccc;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background: #1e1e1e;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #sidebar-header {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            border-bottom: 1px solid #444;
            background: #2a2a2a;
            position: sticky;
            top: 0;
        }

        #sidebar-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #2a2a2a;
        }

        .history-item.selected {
            background: #3a3a3a;
            border-left: 4px solid #4CAF50;
            padding-left: 16px;
        }

        .history-title {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #fff;
        }

        .history-preview {
            font-size: 0.8em;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* Controls Panel */
        .controls {
            margin-bottom: 20px;
            background: #444;
            padding: 10px 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* The Paper Container */
        #receipt-wrapper {
            perspective: 1000px;
        }

        #receipt-container { 
            width: calc(var(--paper-width) * var(--zoom));
            background: white; 
            padding: calc(5mm * var(--zoom)); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            min-height: calc(100mm * var(--zoom));
            color: black;
            transition: width 0.1s ease;
        }

        .line { 
            min-height: 1.2em; 
            white-space: pre-wrap; 
            word-break: break-all; 
            /* To ensure exact width matching, we base font size on width.
               In monospace fonts, width is usually ~0.6 * font-size.
               So font-size = char-width / 0.6 */
            font-size: calc(var(--char-width) * 1.666 * var(--zoom) * var(--font-scale));
            line-height: 1.2;
            letter-spacing: 0;
            transform-origin: left top;
        }

        .bold { font-weight: bold; }
        
        /* Double Height */
        .dh {
            transform: scaleY(2);
            margin-bottom: 1.2em;
        }

        /* Double Width */
        .dw {
            transform: scaleX(2);
            /* Adjust width so text still wraps relative to the container */
            width: 50%;
        }

        /* Double Height and Width */
        .dh.dw {
            transform: scale(2, 2);
            width: 50%;
            margin-bottom: 1.2em;
        }

        .image-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        .cut { 
            border-top: calc(2px * var(--zoom)) dashed #000;
            margin-top: calc(10px * var(--zoom));
            margin-bottom: 0;
            width: 100%;
        }

        #hex-log {
            margin-top: 30px;
            width: 80%;
            font-size: 10px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            color: #0f0;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">Bill History</div>
        <div id="sidebar-list">
            <!-- History items will be injected here -->
        </div>
    </div>

    <div id="main-content">
        <div class="controls">
            <div>
                <label>Zoom Scale:</label>
                <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.1" value="1.5">
                <span id="zoomVal">150%</span>
            </div>
            <div>
                <label>Font Size:</label>
                <input type="range" id="fontRange" min="0.5" max="2.0" step="0.05" value="1.0">
                <span id="fontVal">100%</span>
            </div>
        </div>

    <div id="receipt-wrapper">
        <div id="receipt-container">
            <div id="bill-content">Waiting for printer data...</div>
        </div>
    </div>

        <div id="hex-log">
            <strong>Last Raw Data (Hex):</strong>
            <div id="hex-output">None</div>
        </div>
    </div>

    <script>
        const socket = io();
        const zoomRange = document.getElementById('zoomRange');
        const zoomVal = document.getElementById('zoomVal');
        const fontRange = document.getElementById('fontRange');
        const fontVal = document.getElementById('fontVal');
        const root = document.documentElement;

        let billsHistory = [];
        let currentSelectedId = null;

        // Handle Zoom Slider
        zoomRange.addEventListener('input', (e) => {
            const val = e.target.value;
            root.style.setProperty('--zoom', val);
            zoomVal.textContent = Math.round(val * 100) + '%';
        });

        // Handle Font Scale Slider
        fontRange.addEventListener('input', (e) => {
            const val = e.target.value;
            root.style.setProperty('--font-scale', val);
            fontVal.textContent = Math.round(val * 100) + '%';
        });

        function renderBill(data) {
            const container = document.getElementById('bill-content');
            container.innerHTML = '';
            
            data.bill.forEach(item => {
                const div = document.createElement('div');
                div.style.textAlign = item.align;

                if (item.type === 'image') {
                    div.className = 'image-container';
                    const img = document.createElement('img');
                    img.src = 'data:image/png;base64,' + item.content;
                    div.appendChild(img);
                } else if (item.type === 'cut') {
                    div.className = 'cut';
                } else {
                    div.className = `line ${item.bold ? 'bold' : ''} ${item.dh ? 'dh' : ''} ${item.dw ? 'dw' : ''}`;
                    div.textContent = item.content || ' '; 
                }
                container.appendChild(div);
            });

            document.getElementById('hex-output').innerText = data.raw;
        }

        function extractPreview(billData) {
            let previewText = '';
            for (const item of billData) {
                if (item.type === 'text' && item.content && item.content.trim() !== '') {
                    previewText += item.content.trim() + ' ';
                    if (previewText.length > 50) break;
                }
            }
            return previewText.trim() || 'No text content';
        }

        function renderSidebar() {
            const sidebarList = document.getElementById('sidebar-list');
            sidebarList.innerHTML = '';

            billsHistory.forEach(record => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'history-item';
                if (record.id === currentSelectedId) {
                    itemDiv.classList.add('selected');
                }

                const titleDiv = document.createElement('div');
                titleDiv.className = 'history-title';
                titleDiv.textContent = record.timestamp;

                const previewDiv = document.createElement('div');
                previewDiv.className = 'history-preview';
                previewDiv.textContent = record.preview;

                itemDiv.appendChild(titleDiv);
                itemDiv.appendChild(previewDiv);

                itemDiv.addEventListener('click', () => {
                    currentSelectedId = record.id;
                    renderSidebar();
                    renderBill(record.data);
                });

                sidebarList.appendChild(itemDiv);
            });
        }

        socket.on('new_bill', function(data) {
            const newRecord = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                timestamp: new Date().toLocaleString(),
                preview: extractPreview(data.bill),
                data: data
            };

            billsHistory.unshift(newRecord);
            currentSelectedId = newRecord.id;

            renderSidebar();
            renderBill(data);
        });
    </script>
</body>
</html>
